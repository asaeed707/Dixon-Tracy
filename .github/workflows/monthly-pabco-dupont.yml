name: Monthly PABCO Tacoma and Basalite Dupont

on:
  schedule:
    - cron: "45 13 1 * *"
  workflow_dispatch:
    inputs:
      report_month:
        description: "Optional report month in YYYY-MM format"
        required: false
        type: string

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    env:
      GEOTAB_USERNAME: ${{ secrets.GEOTAB_USERNAME }}
      GEOTAB_PASSWORD: ${{ secrets.GEOTAB_PASSWORD }}
      GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
      GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      REPORT_MONTH: ${{ inputs.report_month }}
      REQUIRE_EMAIL: "1"
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build and email combined monthly PDF
        run: python scripts/monthly_pabco_dupont.py
      - name: Upload report and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-pabco-tacoma-basalite-dupont
          path: |
            outputs/*.pdf
            work/*.json

name: Dixon Tracy Loading Times

on:
  schedule:
    # GitHub cron uses UTC. Trigger at both possible UTC hours and gate below so
    # the report runs at 6:00 AM Pacific across daylight-saving changes.
    - cron: "0 13,14 * * 1-5"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date in YYYY-MM-DD format"
        required: false
        type: string

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    env:
      GEOTAB_USERNAME: ${{ secrets.GEOTAB_USERNAME }}
      GEOTAB_PASSWORD: ${{ secrets.GEOTAB_PASSWORD }}
      GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
      GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.DIXON_TRACY_EMAIL_TO }}
      REPORT_DATE: ${{ inputs.report_date }}
      REQUIRE_EMAIL: "1"
      TZ: America/Los_Angeles

    steps:
      - name: Confirm 6 AM Pacific schedule
        id: schedule_gate
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(TZ=America/Los_Angeles date +%H)" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build and email reports
        if: steps.schedule_gate.outputs.run == 'true'
        run: python scripts/dixon_tracy_loading_times.py

      - name: Add report summary
        if: always() && steps.schedule_gate.outputs.run == 'true'
        run: |
          {
            echo "## Dixon Tracy Loading Times"
            echo
            if ls work/bb_dixon_tracy_loading_times_*.json >/dev/null 2>&1; then
              python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("work").glob("bb_dixon_tracy_loading_times_*.json")):
              audit = json.loads(path.read_text())
              print(f"- Report date: `{audit['reportDate']}` ({audit['weekday']})")
              print(f"- Raw Geotab zone events: `{audit['rawEventCount']}`")
              for label, zone in audit["zones"].items():
                  print(
                      f"- {label}: `{zone['cleanedLoadCount']}` loads, "
                      f"`{zone['ignoredUnder25Count']}` ignored under-25 stops, "
            f"`{zone['longLoadCount']}` over 1:30, "
            f"`{zone['probableErrorCount']}` probable errors over 4:00, "
            f"starts within 5:00 AM-5:00 PM `{zone['startsWithinOperatingWindow']}`, "
            f"sorted starts `{zone['sortedStartTimes']}`"
                  )
          PY
            else
              echo "- No audit JSON was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report files
        if: always() && steps.schedule_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dixon-tracy-loading-times
          path: |
            outputs/*.xlsx
            outputs/*.pdf
            work/*.json
